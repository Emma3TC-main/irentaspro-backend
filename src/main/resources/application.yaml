spring:
  application:
    name: irentaspro

  datasource:
    url: ${DB_URL}                # ej: jdbc:postgresql://<host>:<port>/<db>?sslmode=require
    username: ${DB_USERNAME}      # ej: avnadmin
    password: ${DB_PASSWORD}      # NUNCA en texto plano
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    mongodb:
      uri: ${MONGODB_URI}         # ej: mongodb+srv://<user>:<pass>@<cluster>/<db>?retryWrites=true&w=majority

server:
  port: ${PORT:8080}

logging:
  level:
    org.springframework: INFO
