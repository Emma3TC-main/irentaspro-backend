spring:
  application:
    name: irentaspro

  datasource:
    url: ${DB_URL} # ej: jdbc:postgresql://<host>:<port>/<db>?sslmode=require
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    mongodb:
      uri: ${MONGO_URI}

  # --- Configuración PayPal ---
  paypal:
    client-id: ${PAYPAL_CLIENT_ID}
    client-secret: ${PAYPAL_CLIENT_SECRET}
    mode: sandbox # o live, según uses

server:
  port: ${PORT:8080}

logging:
  level:
    org.springframework: INFO
